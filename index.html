
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Maintenance | Toxic Ludo King</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10101c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    padding: 20px;
}
.container { max-width: 450px; }
.logo {
    width: 95px;
    height: 95px;
    object-fit: contain;
    border-radius: 20px;
    margin-bottom: 25px;
}
h1 { font-size: 32px; margin: 10px 0; }
p { color: #a5a5b8; line-height: 1.6; }
.dice {
    width: 85px;
    height: 85px;
    background: white;
    color: #222;
    border-radius: 15px;
    margin: 35px auto 20px;
    display: grid;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    padding: 12px;
    cursor: pointer;
    box-shadow: 0 8px 30px #0008;
}
.dot {
    width: 12px;
    height: 12px;
    background: #222;
    border-radius: 50%;
    align-self: center;
    justify-self: center;
    visibility: hidden;
}
.dice.rolling {
    animation: roll .7s ease-in-out;
}
@keyframes roll {
    0% { transform: rotate(0) scale(1); }
    30% { transform: rotate(180deg) scale(1.2); }
    65% { transform: rotate(360deg) scale(.9); }
    100% { transform: rotate(720deg) scale(1); }
}
button {
    background: #7546ff;
    color: white;
    border: 0;
    padding: 13px 28px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}
button:hover { background: #6334e8; }
button:disabled { opacity: .6; cursor: wait; }
.footer { margin-top: 45px; font-size: 12px; color: #66667a; }
</style>
</head>
<body>

<div class="container">
    <img class="logo"
         src="https://res.cloudinary.com/dudxuaikc/image/upload/v1788072026/battle_results/qqlmo20uwpjmmdjupfxt.png"
         alt="Toxic Ludo King">

    <h1>We'll Be Back Soon!</h1>
    <p>
        We're upgrading Toxic Ludo King to give you
        a better gaming experience. Our website is
        temporarily under maintenance.
    </p>

    <div class="dice" id="dice" onclick="rollDice()" aria-label="Click to roll dice">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>

    <button id="rollBtn" onclick="rollDice()">🎲 Roll the Dice</button>
    <p id="result">Feeling lucky? Give it a roll!</p>

    <div class="footer">
        © 2026 Toxic Ludo King. All rights reserved.
    </div>
</div>

<script>
const dice = document.getElementById('dice');
const dots = dice.querySelectorAll('.dot');
const result = document.getElementById('result');
const btn = document.getElementById('rollBtn');

const faces = {
    1: [4],
    2: [0, 8],
    3: [0, 4, 8],
    4: [0, 2, 6, 8],
    5: [0, 2, 4, 6, 8],
    6: [0, 2, 3, 5, 6, 8]
};

let rolling = false;

function rollDice() {
    if (rolling) return;

    rolling = true;
    btn.disabled = true;
    result.textContent = 'Rolling...';

    dice.classList.remove('rolling');
    void dice.offsetWidth;
    dice.classList.add('rolling');

    const value = Math.floor(Math.random() * 6) + 1;

    setTimeout(() => {
        dots.forEach((dot, i) => {
            dot.style.visibility =
                faces[value].includes(i) ? 'visible' : 'hidden';
        });

        result.textContent = `You rolled a ${value}! 🎉`;
        dice.classList.remove('rolling');
        btn.disabled = false;
        rolling = false;
    }, 700);
}

// Initial dice face
dots[4].style.visibility = 'visible';
</script>

</body>
</html>
